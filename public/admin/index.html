<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Edit website | Friends of Denton Dene</title><link rel="stylesheet" href="/style.css?v=3"><link rel="stylesheet" href="/admin/admin.css?v=8"><script defer src="/admin/admin.js?v=8"></script></head><body><form id="login"><h1>Volunteer login</h1><label>Username<input id="username" autocomplete="username" value="admin" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Log in</button></form><div id="app" hidden><header class="editor-toolbar"><div class="primary-controls"><label>Page <select id="page"></select></label><button id="publish">Publish</button><button id="undo" title="Undo" aria-label="Undo">↶</button><details class="tool-menu"><summary>＋ Add</summary><div class="tool-panel"><label>Section <select id="kind"><option value="text">Text</option><option value="image">Photo</option><option value="button">Button</option><option value="event">Event</option><option value="map">Map</option></select></label><button id="add">Insert</button></div></details><a href="/admin/forms">Forms</a><button id="settings-open" aria-label="Settings" title="Settings">⚙</button></div><div id="properties" aria-label="Selected item controls"><span>Select something to edit</span></div><p id="status" role="status" aria-live="polite"></p></header><iframe id="site" title="Editable website"></iframe></div><dialog id="settings"><header><h2>Settings</h2><button id="settings-close" aria-label="Close settings">×</button></header><details open><summary>Page</summary><div class="settings-section"><label>Page title<input id="page-title"></label><label>Search description<textarea id="description"></textarea></label><div class="settings-actions"><button id="draft">Save draft</button><button id="load-draft">Load saved draft</button></div><label>Version history<select id="revisions"></select></label><button id="restore">Restore selected version</button></div></details><details><summary>Files</summary><div class="settings-section"><label class="upload-label">Upload a photo or PDF<input id="library-upload" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></label><div id="media"></div></div></details><details><summary>Account</summary><div class="settings-section"><form id="password-form"><label>Current password<input id="current-password" type="password" autocomplete="current-password" required></label><label>New password<input id="new-password" type="password" autocomplete="new-password" minlength="8" required></label><button>Change password</button></form><a href="/api/export" download>Download website backup</a><button id="logout">Log out</button></div></details></dialog></body></html>
