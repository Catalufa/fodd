<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Edit website | Friends of Denton Dene</title><link rel="stylesheet" href="/style.css?v=3"><link rel="stylesheet" href="/admin/admin.css?v=3"><script defer src="/admin/admin.js?v=4"></script></head><body><form id="login"><h1>Volunteer login</h1><label>Username<input id="username" autocomplete="username" value="admin" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Log in</button></form><div id="app" hidden><header class="editor-toolbar"><div class="primary-controls"><label>Page <select id="page"></select></label><button id="publish">Publish</button><button id="draft">Save draft</button><button id="undo">Undo</button><label>Add <select id="kind"><option value="text">Text</option><option value="image">Photo</option><option value="button">Button</option><option value="event">Event</option><option value="map">Map</option></select></label><button id="add">Add section</button><a href="/admin/forms">Forms</a><details class="more"><summary>More</summary><div class="more-panel"><label>Page title<input id="page-title"></label><label>Search description<textarea id="description"></textarea></label><button id="load-draft">Continue saved draft</button><label>Earlier version<select id="revisions"></select></label><button id="restore">Restore version</button><label>Upload a file<input id="library-upload" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></label><div id="media"></div><a href="/api/export" download>Download content backup</a><form id="password-form"><label>Current password<input id="current-password" type="password" required></label><label>New password<input id="new-password" type="password" minlength="8" required></label><button>Change password</button></form><button id="logout">Log out</button></div></details></div><div id="properties" aria-label="Selected item controls"><span>Click text, an image or a button on the page to edit it.</span></div><p id="status" role="status" aria-live="polite"></p></header><iframe id="site" title="Editable website"></iframe></div></body></html>
