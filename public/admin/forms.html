<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forms | Friends of Denton Dene</title><link rel="stylesheet" href="/style.css?v=3"><link rel="stylesheet" href="/admin/forms.css?v=6"><script defer src="/admin/forms.js?v=6"></script></head><body><header class="site-header"><a class="brand" href="/admin">← Website</a></header><main class="form-admin"><div class="forms-heading"><h1>Forms</h1><button id="new">＋ New form</button></div><p id="status" role="status"></p><section id="login"><form id="login-form"><label>Username<input id="username" value="admin" required></label><label>Password<input id="password" type="password" required></label><button>Log in</button></form></section><div id="app" hidden><div class="form-layout"><aside aria-label="Your forms"><div id="list"></div></aside><div id="builder"><div class="builder-top"><div class="tabs" role="tablist"><button id="edit-tab" role="tab" aria-selected="true">Build</button><button id="responses-tab" role="tab" aria-selected="false">Responses</button></div><button id="save">Save</button></div><div id="edit-view"><label>Form title<input id="title"></label><label>Description<textarea id="description"></textarea></label><div id="questions"></div><button id="add" class="add-question">＋ Add question</button><details class="form-settings"><summary>Settings</summary><label class="check"><input id="active" type="checkbox" checked> Accept responses</label><label class="check"><input id="notify" type="checkbox"> Browser notifications</label><button id="delete" class="danger">Delete form</button></details><p id="link"></p></div><div id="response-view" hidden><p id="count"></p><a id="csv" download>Download CSV</a><div id="responses"></div></div></div></div></div></main></body></html>
